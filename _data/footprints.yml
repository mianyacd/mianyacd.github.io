# Academic footprints, shown on /footprints/ (map + list).
#
# To add a stop, copy an entry to the TOP (newest first) and fill in:
#   event   (required) e.g. "SACMAT 2025"
#   date    (required) e.g. "Jul 2025"
#   place   (required) e.g. "Stony Brook, NY, USA"
#   lat/lng (required) coordinates. In Google Maps, right-click the spot;
#           the first line of the menu is "lat, lng".
#   note    optional: what you did there (talk title, paper, role ...)
#   award   optional
#   url     optional: conference website

